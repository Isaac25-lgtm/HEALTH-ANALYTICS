# Render Blueprint for the pre-DHIS2 UAT deployment (~100 light users).
#
# PREPARED, NOT DEPLOYED, NOT VALIDATED BY RENDER. It has not been run through Render's
# Blueprint validator or CLI (no Render account access was authorised). Check the current
# Blueprint specification for every field before first use; see docs/DEPLOYMENT.md.
#
# Topology, deliberately small:
#   hpip-web     public web service (Next.js). The browser only calls /api on this origin; the
#                /api route forwards server-side to the private API, so cookies stay same-origin.
#   hpip-api     PRIVATE service (FastAPI). No public URL; reachable only on the private network.
#   hpip-worker  one Celery worker consuming exports, sync and maintenance.
#   hpip-redis   Key Value instance: broker, results and distributed rate limiting.
#   hpip-purge   daily retention job, the same purge service as the Celery maintenance task.
#
# Not included in the initial UAT topology: a scheduled DHIS2 refresh. Live use is authorised,
# but the rotated hosted secret and approved mappings are not present yet; docs/DEPLOYMENT.md
# shows how to add the six-hour cron after those gates pass.
#
# PostgreSQL is Neon (external). No Render PostgreSQL is provisioned.
#
# Configuration pattern (Render does not allow `sync: false` inside a Blueprint environment group):
#   - hpip-shared-config  Blueprint-defined group with NON-SECRET shared settings only.
#   - Secrets and deployment-specific values are declared once, on hpip-api, as `sync: false`
#     (entered by the operator) or `generateValue: true`.
#   - hpip-worker and hpip-purge copy those exact values with `fromService ... envVarKey`, so
#     every backend process receives identical secrets without retyping them.

databases: []

envVarGroups:
  - name: hpip-shared-config
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Neon: TLS required; small pools (API + worker stay within a small connection budget).
      - key: DB_SSLMODE
        value: require
      - key: DB_REQUIRE_SSL
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: SEED_DEV_DATA
        value: "false"
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: SYNC_EXECUTION
        value: queue
      - key: EXPORT_EAGER
        value: "false"
      # Render services do not share a disk: export bytes live in the database and expire.
      - key: EXPORT_ARTIFACT_STORAGE
        value: database
      - key: EXPORT_SHARED_FILESYSTEM
        value: "false"
      - key: EXPORT_ARTIFACT_MAX_BYTES
        value: "26214400"
      # Retention (owner decision D-043) and the operational-record engineering default.
      - key: RAW_AGGREGATE_RETENTION_DAYS
        value: "7"
      - key: MPDSR_EVENT_RETENTION_HOURS
        value: "24"
      - key: EXPORT_FILE_RETENTION_HOURS
        value: "24"
      - key: EXPORT_JOB_RETENTION_DAYS
        value: "90"
      - key: CALCULATION_SNAPSHOT_RETENTION_MONTHS
        value: "36"
      - key: AUDIT_LOG_RETENTION_MONTHS
        value: "24"
      - key: OPERATIONAL_RECORD_RETENTION_DAYS
        value: "90"
      - key: PURGE_ENABLED
        value: "true"
      - key: PURGE_DRY_RUN
        value: "false"
      # DHIS2 host is known (D-049) but not connected: no credentials, mappings or sync.
      - key: DHIS2_ENABLED
        value: "false"
      - key: SYNC_ENABLED
        value: "false"
      - key: DHIS2_LOGIN_ENABLED
        value: "false"
      - key: DHIS2_AUTH_METHOD
        value: basic
      - key: DHIS2_BASE_URL
        value: https://hmis.health.go.ug
      - key: AI_ENABLED
        value: "false"

services:
  - type: keyvalue
    name: hpip-redis
    plan: starter
    ipAllowList: []              # no external access; reachable from services in this workspace
    maxmemoryPolicy: noeviction  # a broker must not silently drop queued jobs

  - type: pserv
    name: hpip-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # Schema first, then the approved reference configuration, before new code takes traffic.
    # The first administrator is created once, by hand, afterwards (docs/DEPLOYMENT.md).
    preDeployCommand: alembic upgrade head && python scripts/bootstrap_reference_data.py
    envVars:
      - fromGroup: hpip-shared-config
      - key: DATABASE_URL            # Neon pooled connection string (postgresql://... accepted)
        sync: false
      - key: MIGRATION_DATABASE_URL  # Neon direct connection string, used by the pre-deploy command
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: SEED_PASSWORD           # never used in production; must not be the development default
        generateValue: true
      - key: WEB_ORIGIN              # https URL of hpip-web
        sync: false
      - key: ALLOWED_ORIGINS         # the same https URL of hpip-web
        sync: false
      - key: ALLOWED_HOSTS           # hpip-api's private hostname (the proxy's Host header)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hpip-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: hpip-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: hpip-redis
          property: connectionString
      # Enter a dedicated, least-privilege integration identity before enabling sync. Do not use
      # an individual user's temporary password for a hosted deployment.
      - key: DHIS2_USERNAME
        sync: false
      - key: DHIS2_PASSWORD
        sync: false
      - key: DHIS2_PAT
        sync: false

  - type: worker
    name: hpip-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # One worker for every queue: exports, future DHIS2 sync and maintenance.
    dockerCommand: >-
      celery --app=app.workers.celery_app:celery_app worker
      --queues=exports,sync,maintenance --concurrency=2 --loglevel=INFO
      --without-gossip --without-mingle
    envVars:
      - fromGroup: hpip-shared-config
      - key: DATABASE_URL
        fromService: {type: pserv, name: hpip-api, envVarKey: DATABASE_URL}
      - key: AUTH_SECRET
        fromService: {type: pserv, name: hpip-api, envVarKey: AUTH_SECRET}
      - key: SEED_PASSWORD
        fromService: {type: pserv, name: hpip-api, envVarKey: SEED_PASSWORD}
      - key: WEB_ORIGIN
        fromService: {type: pserv, name: hpip-api, envVarKey: WEB_ORIGIN}
      - key: ALLOWED_ORIGINS
        fromService: {type: pserv, name: hpip-api, envVarKey: ALLOWED_ORIGINS}
      - key: ALLOWED_HOSTS
        fromService: {type: pserv, name: hpip-api, envVarKey: ALLOWED_HOSTS}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}
      - key: CELERY_BROKER_URL
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}
      - key: CELERY_RESULT_BACKEND
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}
      - key: DHIS2_USERNAME
        fromService: {type: pserv, name: hpip-api, envVarKey: DHIS2_USERNAME}
      - key: DHIS2_PASSWORD
        fromService: {type: pserv, name: hpip-api, envVarKey: DHIS2_PASSWORD}
      - key: DHIS2_PAT
        fromService: {type: pserv, name: hpip-api, envVarKey: DHIS2_PAT}

  - type: web
    name: hpip-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    healthCheckPath: /login
    envVars:
      # Read at request time by src/app/api/[...path]/route.ts. hostport is a bare host:port;
      # the proxy normalises it to http://host:port. Not needed at build time.
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: pserv
          name: hpip-api
          property: hostport
      - key: NODE_ENV
        value: production

  - type: cron
    name: hpip-purge
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    # Daily retention pass through the shared purge service. A failed policy is retried within
    # the run and a remaining failure exits non-zero, so Render records the run as failed.
    schedule: "30 1 * * *"
    dockerCommand: python scripts/purge_expired.py --source scheduler --max-attempts 3 --retry-delay-seconds 120
    envVars:
      - fromGroup: hpip-shared-config
      - key: DATABASE_URL
        fromService: {type: pserv, name: hpip-api, envVarKey: DATABASE_URL}
      - key: AUTH_SECRET
        fromService: {type: pserv, name: hpip-api, envVarKey: AUTH_SECRET}
      - key: SEED_PASSWORD
        fromService: {type: pserv, name: hpip-api, envVarKey: SEED_PASSWORD}
      - key: WEB_ORIGIN
        fromService: {type: pserv, name: hpip-api, envVarKey: WEB_ORIGIN}
      - key: ALLOWED_ORIGINS
        fromService: {type: pserv, name: hpip-api, envVarKey: ALLOWED_ORIGINS}
      - key: ALLOWED_HOSTS
        fromService: {type: pserv, name: hpip-api, envVarKey: ALLOWED_HOSTS}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}
      - key: CELERY_BROKER_URL
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}
      - key: CELERY_RESULT_BACKEND
        fromService: {type: keyvalue, name: hpip-redis, property: connectionString}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hpip-api"
version = "0.8.0"
description = "Uganda Health Performance Intelligence Platform API (corrective Phases 1–7)"
requires-python = ">=3.12"
# Upper bounds keep CI on the stack the suites are actually verified against. Without them a
# runner resolves the newest release of every library: on 2026-09-16 that installed FastAPI 0.141
# with Starlette 1.6, whose router composition broke the GET-route contract test. Raise a bound
# only with a deliberate upgrade and a full re-verification.
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.35",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14.0,<2",
  "pydantic-settings>=2.6.0,<3",
  "pydantic>=2.11,<2.12",
  "email-validator>=2.2.0,<3",
  "pyjwt>=2.10.0,<3",
  "bcrypt>=4.2.0,<6",
  "python-multipart>=0.0.17,<0.1",
  "psycopg[binary]>=3.2.0,<4",
  "httpx>=0.27.0,<0.29",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2",
  "python-docx>=1.1.0,<2",
  "reportlab>=4.2.0,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "pytest-asyncio>=0.24.0,<1",
  "ruff>=0.7.0,<0.17",
  "pyyaml>=6.0,<7",
]
worker = [
  "celery[redis]>=5.3.6,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = [".", "alembic"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

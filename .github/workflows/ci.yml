name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, PostgreSQL migrations, pytest on SQLite + PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hpip_ci
          POSTGRES_DB: hpip_ci
          # Ephemeral service container reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hpip_ci -d hpip_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      HPIP_POSTGRES_TEST_URL: postgresql+psycopg://hpip_ci@127.0.0.1:5432/postgres
      HPIP_REDIS_TEST_URL: redis://127.0.0.1:6379/15
      HPIP_FAIL_ON_SKIP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install API, worker and test dependencies
        run: python -m pip install -e ".[dev,worker]"
      - name: Ruff
        run: python -m ruff check app tests alembic scripts
      - name: Migrate an empty PostgreSQL database to head
        env:
          DATABASE_URL: postgresql+psycopg://hpip_ci@127.0.0.1:5432/hpip_ci
        run: |
          python -m alembic upgrade head
          python -m alembic current
      - name: Test suite (any skipped PostgreSQL or Redis test fails the job)
        run: python -m pytest -q -rs -p no:cacheprovider

  frontend:
    name: Frontend (TypeScript, ESLint, Vitest, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HPIP_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install the end-to-end API
        run: python -m pip install -e "../backend[dev,worker]"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Install Playwright-managed Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run e2e
      - name: Fail on skipped or missing Playwright tests
        if: always()
        run: node scripts/assert-no-skips.mjs playwright-report/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e-screenshots
          if-no-files-found: ignore

  containers:
    name: Containers (compose validation, image build, queue smoke)
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets for this run only
        run: |
          {
            echo "APP_ENV=production"
            echo "POSTGRES_USER=hpip_ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DB=hpip_ci"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "WEB_ORIGIN=https://hpip-ci.invalid"
            echo "ALLOWED_ORIGINS=https://hpip-ci.invalid"
            echo "ALLOWED_HOSTS=hpip-ci.invalid,localhost"
            echo "HEALTHCHECK_HOST=localhost"
            echo "NEXT_PUBLIC_API_BASE_URL=https://hpip-ci.invalid"
          } > "$RUNNER_TEMP/compose.env"
      - name: Compose refuses to render without required secrets
        run: |
          if docker compose config -q 2>/dev/null; then
            echo "docker compose config succeeded without required secrets"
            exit 1
          fi
      - name: Validate compose files
        run: |
          docker compose --env-file "$RUNNER_TEMP/compose.env" config -q
          docker compose -f docker-compose.dev.yml config -q
      - name: Build and start PostgreSQL, Redis, migrations, API and worker
        run: docker compose --env-file "$RUNNER_TEMP/compose.env" up -d --build --wait --wait-timeout 420 api worker
      - name: Readiness, worker ping and queue dispatch/consumption
        run: |
          docker compose --env-file "$RUNNER_TEMP/compose.env" exec -T api python -c "import json, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/ready', headers={'Host': 'localhost'}); body = json.load(urllib.request.urlopen(request, timeout=10)); print({k: body[k] for k in ('status', 'database', 'queue', 'redis')}); assert body['status'] == 'ok', body['config_errors']"
          docker compose --env-file "$RUNNER_TEMP/compose.env" exec -T worker celery --app=app.workers.celery_app:celery_app inspect ping --timeout=10
          docker compose --env-file "$RUNNER_TEMP/compose.env" exec -T api python scripts/queue_smoke.py --timeout 120
      - name: Service logs
        if: failure()
        run: docker compose --env-file "$RUNNER_TEMP/compose.env" logs --no-color
      - name: Stop and remove
        if: always()
        run: docker compose --env-file "$RUNNER_TEMP/compose.env" down -v
